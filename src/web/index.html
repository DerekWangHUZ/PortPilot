<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortPilot</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<!-- S1 外壳链路（模板 chrome.css）：.window(32px 圆角+描边) → .main → .page(滚动容器) → .page-inner(让位) → .toolbar
     侧栏不再是 flex 分栏，而是 fixed 悬浮玻璃（S3）；页面让位由 .page-inner 的 padding-left 完成。 -->
<div class="window" id="window">
  <main class="main">
    <div class="page" id="page">
      <div class="page-inner" id="page-inner">
        <div class="toolbar" id="toolbar">
          <div class="toolbar__heading">
            <h1 class="toolbar__title" id="toolbar-title">总览</h1>
            <span class="toolbar__subtitle" id="toolbar-subtitle"></span>
          </div>
          <div class="toolbar__actions" id="toolbar-actions"></div>
        </div>
        <div class="view" id="view"></div>
      </div>
    </div>
  </main>

  <!-- S3 真悬浮玻璃侧栏：五段解剖 chrome→header→search→scroll→footer -->
  <aside class="sidebar" aria-label="导航">
    <div class="sidebar__chrome" data-drag>
      <div class="traffic">
        <button class="light close" data-win="close" aria-label="关闭"></button>
        <button class="light min" data-win="min" aria-label="最小化"></button>
        <button class="light max" data-win="max" aria-label="最大化"></button>
      </div>
    </div>
    <div class="sidebar__header" data-drag>
      <span class="sidebar__logo-mark" aria-hidden="true">P</span>
      <span class="sidebar__logo-text">PortPilot<span class="sidebar__logo-sub" id="brand-sub">端口管理器</span></span>
    </div>

    <div class="sidebar__search-wrap">
      <button type="button" class="sidebar__search-btn" id="open-command" aria-label="快速跳转或搜命令">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="sidebar__search-label">快速跳转或搜命令…</span>
        <kbd class="sidebar__kbd">⌘K</kbd>
      </button>
    </div>

    <nav class="sidebar__scroll" id="nav-scroll">
      <div class="nav-section-title">工作台</div>
      <div class="nav-group" id="nav"></div>
      <div class="nav-section-title">系统</div>
      <div class="nav-group nav-group--compact" id="nav-system"></div>
    </nav>

    <div class="sidebar__footer" id="sidebar-foot">
      <div class="core-card" id="core-card">
        <div class="core-line">
          <i class="dot" id="core-dot"></i>
          <span id="core-text">正在检测…</span>
        </div>
        <small id="core-detail">—</small>
      </div>
      <button type="button" class="nav-ghost" id="nav-quit">
        <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
        <span>退出</span>
      </button>
    </div>
  </aside>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal-mask" id="modal-mask"><div class="modal" id="modal"></div></div>

<script src="shared/util.js"></script>
<script src="shared/yamledit.js"></script>
<script src="shared/model.js"></script>
<script src="shared/state.js"></script>
<script src="shared/payload.js"></script>
<script src="shared/vergetpl.js"></script>
<script src="shared/api.js"></script>
<script src="shared/log.js"></script>
<script src="shared/core.js"></script>
<script src="js/bridge.js"></script>
<script src="js/ui.js"></script>
<script src="js/mac-scrollbar.js"></script>
<script src="js/command-palette.js"></script>
<script src="js/pages/overview.js"></script>
<script src="js/pages/ports.js"></script>
<script src="js/pages/nodes.js"></script>
<script src="js/pages/connections.js"></script>
<script src="js/pages/rules.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/pages/logs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
